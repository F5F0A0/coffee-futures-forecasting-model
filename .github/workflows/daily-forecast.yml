name: daily-forecast

# When to run:
#   - 23:00 UTC weekdays = 18:00 ET (EST) / 19:00 ET (EDT)
#   - This is 4.5–5.5 hours after ICE Coffee C settles (~13:30 ET) and well
#     past the window when Yahoo Finance finalizes the day's KC=F bar
#     (settlement reflected on Yahoo by ~19:30 UTC EDT / ~20:30 UTC EST).
#   - workflow_dispatch lets us trigger manually from the Actions tab.
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}

# Required so the job can push the updated CSV/PNG back to the repo.
# Also requires: Settings -> Actions -> General -> Workflow permissions
#                -> "Read and write permissions" must be enabled.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Lean install: the live pipeline only touches the GARCH + plotting
        # stack. Heavy research deps (torch, granite-tsfm, prophet,
        # statsforecast, ordpy, statsmodels, sklearn) are lazy-imported
        # inside the wrapper classes they belong to, so they stay off the
        # CI image. --no-deps prevents pip from re-resolving the package's
        # full dependency list from pyproject.toml.
        run: |
          pip install numpy pandas scipy matplotlib arch yfinance
          pip install -e . --no-deps

      - name: Run forecast
        run: |
          python scripts/run_forecast.py
          python -c "import pandas as pd; print(pd.read_csv('forecasts/latest_forecast.csv')['run_date'].iloc[0])" > /tmp/run_date

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/latest_forecast.csv forecasts/latest_forecast.png \
                  forecasts/archive/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            RUN_DATE=$(cat /tmp/run_date)
            git commit -m "forecast: $RUN_DATE"
            git push
          fi